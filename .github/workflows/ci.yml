name: CI

on: [push, pull_request]

# Nothing here writes to the repository, and this runs on pull requests from
# anyone, so the token should not be able to either.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to commits rather than tags, for the same reason.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod

      # Both are expected to be silent.
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # Vet for the target, not the runner: internal/evdev asserts a 32-bit
      # timeval and does not compile anywhere else.
      - run: GOOS=linux GOARCH=arm GOARM=7 go vet ./...

      # Tests run as 32-bit ARM under qemu rather than natively: internal/evdev
      # asserts a 32-bit timeval, so this tree does not compile for the runner
      # at all. Running them at the target word size is the point, because
      # struct input_event is 16 bytes there and 24 here.
      - run: sudo apt-get update && sudo apt-get install -y qemu-user-static
      - run: GOOS=linux GOARCH=arm GOARM=7 go test -exec qemu-arm-static ./...

      # The race detector does not support GOARCH=arm, so the run above cannot
      # use it. These two packages carry the concurrency and are the two that
      # build for the runner, so they get a second run natively.
      - run: go test -race ./internal/esphome/ ./internal/device/

      # build.sh is the only supported build, and it is cgo against OpenSL ES, so
      # CI needs the NDK to build what ships rather than something adjacent to
      # it. The runner image already carries one; this only says where.
      - run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: ./build.sh

      # The shell is half of this repository, so it is linted like the Go.
      - run: sudo apt-get install -y shellcheck
      # A rule rather than a list, like the mode check below: a script added in a
      # directory nobody remembered is still linted.
      - run: git ls-files -z '*.sh' | xargs -0 bash -n
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck -S style
      # A mode is invisible to every other check here: lint, vet, the tests and
      # shellcheck all read these files rather than exec them. A script that
      # lost its bit fails for the first person to run the command README.md
      # gives, and nowhere before that.
      - name: Shell scripts are executable
        run: |
          bad=$(git ls-files -s -- '*.sh' | awk '$1 != "100755" { print $4 }')
          [ -z "$bad" ] || { echo "not executable:"; echo "$bad"; exit 1; }

      # MapDump loads Amazon classes by name, so a mangled one fails on the
      # device and nowhere earlier: a wrong name is still a valid string
      # literal, and compiling proves nothing about it. The shape is what can
      # be checked here.
      - run: deploy/check-identifiers.sh

      # Build the jar as well. That catches neither a wrong class name nor a
      # wrong uid, but it does prove MapDump.java still compiles and that its
      # build.sh still works, and nothing else here covers either.
      #
      # The JDK is pinned because the window is narrow: javac dropped -source
      # 1.7 in JDK 20, and D8 wants 11 or newer.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platforms;android-22 build-tools;34.0.0'
      - name: Build mapdump.jar
        run: |
          export ANDROID_JAR="$ANDROID_SDK_ROOT/platforms/android-22/android.jar"
          export R8_JAR="$ANDROID_SDK_ROOT/build-tools/34.0.0/lib/d8.jar"
          ls -l "$ANDROID_JAR" "$R8_JAR"
          deploy/mapdump/build.sh
